services:
  spideybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spideybot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6414:6414"  # gallery-dl OAuth callback (for: gallery-dl oauth:reddit)
    volumes:
      - ./data:/app/data
      - ./user_sessions:/app/user_sessions
      - ./config/runtime:/app/config/runtime
      - gallery-dl-cache:/app/.gallery-dl

    healthcheck:
      test: ["CMD", "pgrep", "-f", "python main.py"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gallery-dl-cache:
