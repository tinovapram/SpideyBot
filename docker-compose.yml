services:
  postgres:
    image: postgres:16-alpine
    container_name: spideybot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spidey
      POSTGRES_PASSWORD: spidey
      POSTGRES_DB: spideybot
    ports:
      - "5432:5432"  # local dev access; remove if host already runs Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spidey -d spideybot"]
      interval: 10s
      timeout: 5s
      retries: 5

  spideybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spideybot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPIDEY_DATABASE_URL: postgresql+asyncpg://spidey:spidey@postgres:5432/spideybot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6414:6414"  # gallery-dl OAuth callback
      - "9090:9090"  # liveness, readiness, and Prometheus metrics
    volumes:
      - ./data:/app/data
      - ./user_sessions:/app/user_sessions
      - ./config/runtime:/app/config/runtime
      - gallery-dl-cache:/app/.gallery-dl
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "from urllib.request import urlopen; response=urlopen('http://127.0.0.1:9090/readyz', timeout=9); assert response.status == 200"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gallery-dl-cache:
  pgdata:
