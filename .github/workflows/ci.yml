name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spidey
          POSTGRES_PASSWORD: spidey
          POSTGRES_DB: spideybot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spidey -d spideybot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and test tools
        run: python -m pip install ".[test]"

      - name: Compile Python modules
        run: python -m compileall -q core handler downloader tests migrations main.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Run tests
        env:
          SPIDEY_DATABASE_URL: postgresql+asyncpg://spidey:spidey@localhost:5432/spideybot
          SPIDEY_API_ID: "1"
          SPIDEY_API_HASH: ci-placeholder
          SPIDEY_BOT_TOKEN: "123456:ci-placeholder"
          SPIDEY_SESSION_ENCRYPT_KEY: 8D6k2YqJ7m2jN6dGv3m7o5mC8qW4nB9pL1xR6tF0zHk=
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
