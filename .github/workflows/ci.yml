name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spidey
          POSTGRES_PASSWORD: spidey
          POSTGRES_DB: spideybot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spidey -d spideybot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Reproducible install from uv.lock into .venv, so pyright and ruff
      # resolve the same environment locally and in CI
      # (see [tool.pyright] venvPath/venv in pyproject.toml).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and test tools
        run: uv sync --frozen --extra test --python 3.13

      - name: Compile Python modules
        run: .venv/bin/python -m compileall -q core handler downloader tests migrations main.py

      - name: Lint
        run: .venv/bin/ruff check .

      # Advisory until the pre-existing type debt is paid down: the baseline is
      # 80 errors, none of them undefined names (see
      # docs/PROJECT_IMPROVEMENT_SUGGESTIONS.md, P0-6). Flip to blocking once
      # this step reports zero errors.
      - name: Type check (advisory)
        continue-on-error: true
        run: .venv/bin/pyright

      - name: Run tests
        env:
          SPIDEY_DATABASE_URL: postgresql+asyncpg://spidey:spidey@localhost:5432/spideybot
          SPIDEY_TG_API_ID: "1"
          SPIDEY_TG_API_HASH: ci-placeholder
          SPIDEY_TG_BOT_TOKEN: "123456:ci-placeholder"
          SPIDEY_SESSION_ENCRYPT_KEY: 8D6k2YqJ7m2jN6dGv3m7o5mC8qW4nB9pL1xR6tF0zHk=
          SPIDEY_TEST_DATABASE_URL: postgresql+asyncpg://spidey:spidey@localhost:5432/spideybot
        run: .venv/bin/pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
