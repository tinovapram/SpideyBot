[project]
name = "spideybot"
version = "0.1.0"
description = "Telegram media downloader bot (TeraBox, YouTube, TikTok, Reddit, 30+ platforms)"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits Telegram test servers or real hosts; skipped unless SPIDEY_TEST_MODE is set",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic. Reformatting it is churn that the next autogenerate
# would reintroduce, and a long migration line is still a correct one.
"migrations/versions/*.py" = ["E501", "I001"]
